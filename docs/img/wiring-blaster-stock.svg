tch → red joins C →</text><text x="48" y="218" class="note-t" text-anchor="start">pusher runs. Released: C–NC</text><text x="48" y="233" class="note-t" text-anchor="start">shorts the pusher = brake.</text><rect x="850" y="250" width="250" height="91" rx="3" fill="#FFF6B8" stroke="#D8B800"/><path d="M1086,341 L1100,327 L1100,341 Z" fill="#D8B800" opacity=".35"/><text x="858" y="268" class="note-t" text-anchor="start">Measured + matches the switch marks:</text><text x="858" y="283" class="note-t" text-anchor="start">red = 3 · NO</text><text x="858" y="298" class="note-t" text-anchor="start">blue = 1 · C (2–5 Ω to BAT− when</text><text x="858" y="313" class="note-t" text-anchor="start">pressed: through the pusher motor)</text><text x="858" y="328" class="note-t" text-anchor="start">black = 2 · NC (≈ 0 Ω to BAT−, brake)</text><rect x="850" y="380" width="250" height="76" rx="3" fill="#FFF6B8" stroke="#D8B800"/><path d="M1086,456 L1100,442 L1100,456 Z" fill="#D8B800" opacity=".35"/><text x="858" y="398" class="note-t" text-anchor="start">F1 'JK 300' = resettable fuse,</text><text x="858" y="413" class="note-t" text-anchor="start">~3 A hold / ~6 A trip. Red harness</text><text x="858" y="428" class="note-t" text-anchor="start">wire is BAT+ after F1 (inferred).</text><text x="858" y="443" class="note-t" text-anchor="start">Which motor pair is the pusher: TBD.</text></svg>