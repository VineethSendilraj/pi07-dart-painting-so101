<text class="s" x="432" y="273" text-anchor="middle">random noise → refined</text>
<text class="s" x="432" y="288" text-anchor="middle">plan in ~5 steps</text>
<text class="s" x="432" y="84" text-anchor="middle">hosted by PI</text><text class="s" x="432" y="99" text-anchor="middle">(gateway_url)</text>
