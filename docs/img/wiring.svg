<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Tic-tac-toe blaster: final wiring</title>
<style>.l{font-size:13px;fill:#2C2C2A;font-weight:500}.s{font-size:11px;fill:#5F5E5A}.w{font-size:10px;fill:#FFFFFF}.pin{fill:#D3D1C7}</style>
<defs>
<g id="gnd"><line x1="-9" y1="0" x2="9" y2="0" stroke="#2C2C2A" stroke-width="2"/><line x1="-6" y1="4" x2="6" y2="4" stroke="#2C2C2A" stroke-width="2"/><line x1="-3" y1="8" x2="3" y2="8" stroke="#2C2C2A" stroke-width="2"/></g>
<g id="motor"><circle r="18" fill="#B4B2A9" stroke="#444441" stroke-width="2"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">M</text></g>
</defs>
<rect width="960" height="650" fill="#FFFFFF"/>

<!-- laptop -->
<rect x="30" y="28" width="150" height="92" rx="6" fill="#2C2C2A"/>
<rect x="38" y="36" width="134" height="76" rx="2" fill="#85B7EB"/>
<polygon points="18,122 192,122 204,138 6,138" fill="#5F5E5A"/>
<text class="l" x="105" y="158" text-anchor="middle">Laptop</text>
<text class="s" x="105" y="173" text-anchor="middle">Python loop + Claude + π0.7 client</text>

<!-- USB hub -->
<path d="M192 100 C 225 100, 230 88, 260 88" fill="none" stroke="#5F5E5A" stroke-width="5"/>
<rect x="260" y="68" width="250" height="40" rx="10" fill="#444441"/>
<rect x="272" y="82" width="26" height="12" rx="2" fill="#F1EFE8"/><rect x="320" y="82" width="26" height="12" rx="2" fill="#F1EFE8"/><rect x="368" y="82" width="26" height="12" rx="2" fill="#F1EFE8"/><rect x="416" y="82" width="26" height="12" rx="2" fill="#F1EFE8"/><rect x="464" y="82" width="26" height="12" rx="2" fill="#F1EFE8"/>
<circle cx="498" cy="76" r="3" fill="#97C459"/>
<text class="l" x="385" y="60" text-anchor="middle">Powered USB hub</text>


<!-- USB cables -->
<path d="M285 108 C 285 200, 110 185, 110 208" fill="none" stroke="#5F5E5A" stroke-width="4"/>
<path d="M333 108 C 333 250, 265 280, 265 388" fill="none" stroke="#5F5E5A" stroke-width="4"/>
<path d="M381 108 C 381 170, 560 150, 560 212" fill="none" stroke="#5F5E5A" stroke-width="4"/>
<path d="M429 108 C 429 160, 700 150, 700 212" fill="none" stroke="#5F5E5A" stroke-width="4"/>
<path d="M477 108 C 477 150, 860 140, 860 208" fill="none" stroke="#5F5E5A" stroke-width="4" stroke-dasharray="8 5"/>

<!-- follower arm + blaster -->
<rect x="72" y="288" width="76" height="18" rx="3" fill="#444441"/>
<line x1="110" y1="288" x2="96" y2="240" stroke="#EF9F27" stroke-width="12" stroke-linecap="round"/>
<line x1="96" y1="240" x2="150" y2="218" stroke="#EF9F27" stroke-width="10" stroke-linecap="round"/>
<circle cx="110" cy="288" r="6" fill="#2C2C2A"/><circle cx="96" cy="240" r="6" fill="#2C2C2A"/><circle cx="150" cy="218" r="5" fill="#2C2C2A"/>
<rect x="146" y="206" width="46" height="20" rx="4" fill="#D85A30"/><rect x="190" y="212" width="16" height="8" fill="#993C1D"/>
<text class="l" x="110" y="328" text-anchor="middle">Follower arm</text>
<text class="s" x="110" y="343" text-anchor="middle">servo board · blaster taped on</text>

<!-- cameras -->
<rect x="530" y="214" width="60" height="38" rx="5" fill="#2C2C2A"/><circle cx="560" cy="233" r="12" fill="#85B7EB"/><circle cx="560" cy="233" r="5" fill="#0C447C"/>
<text class="l" x="560" y="274" text-anchor="middle">Wrist cam</text><text class="s" x="560" y="289" text-anchor="middle">on the barrel</text>
<rect x="670" y="214" width="60" height="38" rx="5" fill="#2C2C2A"/><circle cx="700" cy="233" r="12" fill="#85B7EB"/><circle cx="700" cy="233" r="5" fill="#0C447C"/>
<text class="l" x="700" y="274" text-anchor="middle">Front cam</text><text class="s" x="700" y="289" text-anchor="middle">overhead, top right</text>

<!-- leader arm -->
<rect x="822" y="288" width="76" height="18" rx="3" fill="#888780"/>
<line x1="860" y1="288" x2="846" y2="240" stroke="#D3D1C7" stroke-width="12" stroke-linecap="round"/>
<line x1="846" y1="240" x2="898" y2="220" stroke="#D3D1C7" stroke-width="10" stroke-linecap="round"/>
<circle cx="860" cy="288" r="6" fill="#5F5E5A"/><circle cx="846" cy="240" r="6" fill="#5F5E5A"/><circle cx="898" cy="220" r="5" fill="#5F5E5A"/>
<text class="l" x="860" y="328" text-anchor="middle">Leader arm</text>
<text class="s" x="860" y="343" text-anchor="middle">plug in only for recording</text>

<!-- buttons -->
<rect x="40" y="420" width="50" height="50" rx="4" fill="#444441"/><circle cx="65" cy="445" r="17" fill="#378ADD"/>
<text class="l" x="65" y="490" text-anchor="middle">DONE</text>
<rect x="40" y="520" width="50" height="50" rx="4" fill="#444441"/><circle cx="65" cy="545" r="17" fill="#E24B4A"/>
<text class="l" x="65" y="590" text-anchor="middle">SHOOT</text>
<line x1="90" y1="445" x2="190" y2="445" stroke="#378ADD" stroke-width="3"/>
<line x1="90" y1="545" x2="190" y2="545" stroke="#D85A30" stroke-width="3"/>
<path d="M40 460 L26 460 L26 596 L190 596" fill="none" stroke="#2C2C2A" stroke-width="2.5"/>
<path d="M40 560 L26 560" fill="none" stroke="#2C2C2A" stroke-width="2.5"/>
<text class="s" x="100" y="612">button's other leg → GND</text>

<!-- ESP32 -->
<rect x="180" y="390" width="170" height="215" rx="6" fill="#26215C"/>
<polyline points="222,398 230,392 238,398 246,392 254,398 262,392 270,398 278,392 286,398 294,392 302,398" fill="none" stroke="#EF9F27" stroke-width="2"/>
<rect x="215" y="404" width="100" height="66" rx="3" fill="#B4B2A9"/>
<text x="265" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">ESP32</text>
<text x="265" y="452" text-anchor="middle" font-size="10" fill="#444441">WROOM</text>
<rect x="250" y="598" width="30" height="10" rx="2" fill="#888780"/>
<g class="pin"><circle cx="190" cy="428" r="3.5"/><circle cx="190" cy="445" r="3.5"/><circle cx="190" cy="462" r="3.5"/><circle cx="190" cy="479" r="3.5"/><circle cx="190" cy="496" r="3.5"/><circle cx="190" cy="513" r="3.5"/><circle cx="190" cy="530" r="3.5"/><circle cx="190" cy="545" r="3.5"/><circle cx="190" cy="562" r="3.5"/><circle cx="190" cy="579" r="3.5"/><circle cx="190" cy="596" r="3.5"/>
<circle cx="340" cy="428" r="3.5"/><circle cx="340" cy="445" r="3.5"/><circle cx="340" cy="462" r="3.5"/><circle cx="340" cy="479" r="3.5"/><circle cx="340" cy="496" r="3.5"/><circle cx="340" cy="513" r="3.5"/><circle cx="340" cy="530" r="3.5"/><circle cx="340" cy="547" r="3.5"/><circle cx="340" cy="564" r="3.5"/><circle cx="340" cy="581" r="3.5"/></g>
<text class="w" x="198" y="449">33</text><text class="w" x="198" y="549">25</text><text class="w" x="198" y="600">GND</text>
<text class="w" x="332" y="449" text-anchor="end">26</text><text class="w" x="332" y="483" text-anchor="end">5V</text><text class="w" x="332" y="517" text-anchor="end">GND</text>

<!-- ESP32 → relay -->
<line x1="340" y1="445" x2="420" y2="455" stroke="#7F77DD" stroke-width="3"/>
<line x1="340" y1="479" x2="420" y2="480" stroke="#E24B4A" stroke-width="3"/>
<line x1="340" y1="513" x2="420" y2="505" stroke="#2C2C2A" stroke-width="3"/>

<!-- relay module -->
<rect x="410" y="420" width="205" height="150" rx="6" fill="#185FA5"/>
<rect x="404" y="447" width="12" height="66" rx="2" fill="#2C2C2A"/>
<circle cx="410" cy="455" r="3" fill="#EF9F27"/><circle cx="410" cy="480" r="3" fill="#EF9F27"/><circle cx="410" cy="505" r="3" fill="#EF9F27"/>
<text class="w" x="422" y="459">IN</text><text class="w" x="422" y="484">VCC</text><text class="w" x="422" y="509">GND</text>
<rect x="462" y="440" width="80" height="80" rx="4" fill="#378ADD" stroke="#0C447C" stroke-width="2"/>
<text class="w" x="502" y="476" text-anchor="middle">SRD-05VDC</text><text class="w" x="502" y="490" text-anchor="middle">relay</text>
<rect x="576" y="440" width="36" height="110" rx="3" fill="#1D9E75"/>
<circle cx="594" cy="460" r="9" fill="#D3D1C7"/><line x1="588" y1="460" x2="600" y2="460" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="594" cy="495" r="9" fill="#D3D1C7"/><line x1="588" y1="495" x2="600" y2="495" stroke="#5F5E5A" stroke-width="2"/>
<circle cx="594" cy="530" r="9" fill="#D3D1C7"/><line x1="588" y1="530" x2="600" y2="530" stroke="#5F5E5A" stroke-width="2"/>
<text class="w" x="570" y="464" text-anchor="end">NO</text><text class="w" x="570" y="499" text-anchor="end">COM</text><text class="w" x="570" y="534" text-anchor="end">NC</text>
<text class="l" x="512" y="590" text-anchor="middle">Relay (1 channel)</text>
<text class="s" x="512" y="605" text-anchor="middle">replaces the fire microswitch</text>

<!-- blaster side -->
<rect x="640" y="365" width="305" height="270" rx="10" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text class="l" x="652" y="384">Blaster (12 V)</text>

<!-- battery pack -->
<rect x="665" y="395" width="112" height="56" rx="4" fill="#2C2C2A"/>
<g fill="#EF9F27"><rect x="672" y="401" width="22" height="20" rx="3"/><rect x="698" y="401" width="22" height="20" rx="3"/><rect x="724" y="401" width="22" height="20" rx="3"/><rect x="750" y="401" width="22" height="20" rx="3"/><rect x="672" y="425" width="22" height="20" rx="3"/><rect x="698" y="425" width="22" height="20" rx="3"/><rect x="724" y="425" width="22" height="20" rx="3"/><rect x="750" y="425" width="22" height="20" rx="3"/></g>
<text class="s" x="706" y="472">8×AA ≈ 12 V</text>
<line x1="690" y1="451" x2="690" y2="478" stroke="#2C2C2A" stroke-width="3"/><use href="#gnd" x="690" y="480"/>

<!-- master switch -->
<line x1="777" y1="408" x2="815" y2="408" stroke="#E24B4A" stroke-width="3.5"/>
<rect x="815" y="392" width="46" height="34" rx="4" fill="#2C2C2A"/>
<rect x="822" y="398" width="32" height="22" rx="3" fill="#E24B4A" transform="rotate(-8 838 409)"/>
<text class="s" x="838" y="442" text-anchor="middle">master ≥5 A</text>
<path d="M861 408 L910 408 L910 470" fill="none" stroke="#E24B4A" stroke-width="3.5"/>

<!-- NO: red -->
<path d="M603 460 L910 460" fill="none" stroke="#E24B4A" stroke-width="3.5"/>
<text class="s" x="905" y="455" text-anchor="end">red · BAT+</text>

<!-- flywheels: white joined to red -->
<path d="M910 470 L832 470 L832 530" fill="none" stroke="#444441" stroke-width="5"/>
<path d="M910 470 L832 470 L832 530" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<path d="M810 530 L855 530" fill="none" stroke="#444441" stroke-width="5"/><path d="M810 530 L855 530" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<line x1="810" y1="530" x2="810" y2="542" stroke="#444441" stroke-width="3"/><line x1="855" y1="530" x2="855" y2="542" stroke="#444441" stroke-width="3"/>
<use href="#motor" x="810" y="560"/><use href="#motor" x="855" y="560"/>
<line x1="810" y1="578" x2="810" y2="592" stroke="#2C2C2A" stroke-width="3"/><use href="#gnd" x="810" y="594"/>
<line x1="855" y1="578" x2="855" y2="592" stroke="#2C2C2A" stroke-width="3"/><use href="#gnd" x="855" y="594"/>
<text class="l" x="832" y="618" text-anchor="middle">Flywheels (white)</text>

<!-- COM: blue to pusher -->
<path d="M603 495 L720 495 L720 542" fill="none" stroke="#378ADD" stroke-width="3.5"/>
<use href="#motor" x="720" y="560"/>
<line x1="720" y1="578" x2="720" y2="592" stroke="#2C2C2A" stroke-width="3"/><use href="#gnd" x="720" y="594"/>
<text class="l" x="720" y="618" text-anchor="middle">Pusher (blue)</text>

<!-- NC: black brake -->
<path d="M603 530 L665 530 L665 558" fill="none" stroke="#2C2C2A" stroke-width="3.5"/><use href="#gnd" x="665" y="560"/>
<text class="s" x="668" y="545">brake</text>

<text class="s" x="936" y="630" text-anchor="end">⏚ = BAT− (black)</text>
</svg>
